name: Version bump gate

on:
  pull_request:

jobs:
  version-bump-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version bump
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eo pipefail
          read_version() {
            git show "$1:.claude-plugin/plugin.json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))'
          }
          base_version=$(read_version "$BASE_SHA")
          head_version=$(read_version "$HEAD_SHA")
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | .github/scripts/version-bump-check.sh "$base_version" "$head_version"
